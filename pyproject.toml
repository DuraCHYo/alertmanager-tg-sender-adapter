[project]
name = "alertmanager-tg-sender-adapter"
version = "1.0.6"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danila Epishev", email = "DEpishev@alfabank.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "playwright>=1.60.0",
    "prometheus-client>=0.25.0",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.48.0",
]
[project.scripts]
alertmanager_tg_sender_adapter = "alertmanager_tg_sender_adapter.main:main"

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = []
