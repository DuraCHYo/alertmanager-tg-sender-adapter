{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alertmanager-tg-sender-adapter.fullname" . }}
  labels:
    {{- include "alertmanager-tg-sender-adapter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}
  selector:
    {{- include "alertmanager-tg-sender-adapter.selectorLabels" . | nindent 4 }}
{{- end -}}